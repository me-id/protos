syntax = "proto3";

package meid.did.v1;

option go_package = "github.com/me-id/protos/gen/go/meid/did/v1;did";

import "google/protobuf/struct.proto";
import "reallyme/crypto/v1/crypto.proto";

// did:me CoreKey as it appears inside the signed core and GenesisBinding.
message CoreKey {
  string id = 1;                         // e.g., "#ed25519"
  string type = 2;                       // REQUIRED: "Multikey" for did:me v1.
  reallyme.crypto.v1.CryptoAlgorithmIdentifier algorithm = 3; // Shared crypto algorithm identifier.
  string public_key_multibase = 4;       // Multikey encoded as multibase base58btc.
}

// DID Document verificationMethod projection. This adds controller to the
// corresponding CoreKey material.
message VerificationMethod {
  string id = 1;                         // e.g., "#ed25519"
  string type = 2;                       // REQUIRED: "Multikey" for did:me v1.
  string controller = 3;                 // DID subject/controller.
  string public_key_multibase = 4;       // Multikey encoded as multibase base58btc.
  reallyme.crypto.v1.CryptoAlgorithmIdentifier algorithm = 5; // Shared crypto algorithm identifier.
}

// Service endpoint projected from CoreService. google.protobuf.Value preserves
// the did:me/DID Core serviceEndpoint model: URI string, object, or array.
message Service {
  string id = 1;
  string type = 2;
  google.protobuf.Value service_endpoint = 3;
}

// Typed serviceEndpoint payload for a did:me MessagingService entry
// (did:me spec Section 5.11). The generic Service message carries this shape
// as a google.protobuf.Value in DID Document projections; this message gives
// messaging clients a schema for that object. The endpoint can be consumed by
// direct asynchronous messaging profiles, MLS-based messaging profiles, or
// future messaging profiles.
message MessagingServiceEndpoint {
  // Delivery or bootstrap endpoint where initial messages, MLS Welcome
  // messages, MLS KeyPackage discovery requests, or other protocol-specific
  // bootstrap artifacts for the controller can be deposited or retrieved.
  // Transport semantics belong to the messaging protocol, not to did:me.
  string uri = 1;
  // Verification method ids (e.g., "#x25519-msg") designated as messaging
  // pre-keys. Every entry MUST reference a verification method listed in the
  // DID Document keyAgreement relationship. A set used for asynchronous
  // session establishment MUST reference at least one X25519 key and at
  // least one ML-KEM-768 or ML-KEM-1024 key (did:me spec Section 5.11).
  repeated string pre_keys = 2;
}

// Signature over UTF8("did:me:v1:core") || canonical_core_cbor.
message Attestation {
  reallyme.crypto.v1.SignatureAlgorithm alg = 1; // MUST match the referenced verification method algorithm.
  string vm = 2;  // Reference to a verification method id.
  bytes sig = 3;  // Raw signature bytes; JSON projection uses base64url.
}

// Optional, non-authoritative Data Integrity proof over currentCore.
message DataIntegrityProof {
  string type = 1;                // "DataIntegrityProof"
  string cryptosuite = 2;         // "es256-jws-cid-2025"
  string verification_method = 3; // Reference listed in assertionMethod.
  string created = 4;             // ISO8601 timestamp; informational.
  string jws = 5;                 // Compact JWS over the currentCore CID string.
  string proof_purpose = 6;       // "assertionMethod"
}

message DomainVerification {
  string type = 1;                       // "DnsTxtVerification" or "HttpsWellKnownVerification"
  string domain = 2;
  string method = 3;                     // REQUIRED: "dns" or "wellknown" (did:me spec Section 15.4).

  oneof binding {
    DNSBinding dns = 4;
    WellKnownBinding well_known = 5 [json_name = "wellknown"]; // Spec JSON key is all-lowercase "wellknown".
  }
}

message DNSBinding {
  string record_name = 1; // Common did:me default: "_did".
  string txt_value = 2;   // TXT record content.
}

message WellKnownBinding {
  string uri = 1;     // Common did:me default: "/.well-known/did-configuration.json".
  string content = 2; // Well-known file content.
}

// CoreUpdatePolicy. threshold is optional; when absent the effective threshold
// is 1. When present it MUST be >= 1 and <= the number of entries in
// allowed_verification_methods (did:me spec Section 5.4). Empty
// allowed_verification_methods is valid only for terminal deactivation records.
message UpdatePolicy {
  repeated string allowed_verification_methods = 1; // Each entry MUST match a CoreKey.id in controller_keys.
  optional uint64 threshold = 2;
}

// Canonical signed did:me core object. This is the authoritative state that is
// DAG-CBOR encoded, content-addressed as currentCore, and signed via
// Attestation.
message Core {
  string id = 1;
  uint64 sequence = 2;      // Monotonic update counter; starts at 1.
  optional string prev = 3; // CID of the previous core; present iff sequence > 1.
  optional bytes nonce = 4; // Present iff sequence=1; exactly 16 bytes.
  google.protobuf.Value controller = 5; // REQUIRED: did:me string or non-empty array of did:me strings.
  repeated CoreKey controller_keys = 6;
  repeated string authentication_keys = 7; // References into controller_keys by CoreKey.id.
  repeated string assertion_keys = 8;
  repeated string key_agreement_keys = 9;
  repeated Service services = 10;
  UpdatePolicy update_policy = 11; // REQUIRED (did:me spec Section 5.2).
}

// Identifier binding input for did:me v1 genesis identifiers:
// { nonce, updatePolicy, controllerKeys }, encoded as canonical DAG-CBOR.
message GenesisBinding {
  bytes nonce = 1; // Exactly 16 bytes.
  UpdatePolicy update_policy = 2;
  repeated CoreKey controller_keys = 3;
}

// DID Document projection for the did:me v1 default profile. Validation must
// be performed against core_cbor/current_core and attestations, not by trusting
// this projection alone.
message DIDDocument {
  string id = 1;
  google.protobuf.Value controller = 2; // REQUIRED: did:me string or non-empty array of did:me strings.
  // JSON-LD @context values. The first three entries MUST be, in order:
  // https://www.w3.org/ns/did/v1, https://w3id.org/security/multikey/v1,
  // https://did-me.org/ns/did-me/v1 (did:me spec Section 10). Additional
  // contexts may follow; inline JSON-LD object contexts are not representable
  // here and require the JSON document form.
  repeated string context = 3 [json_name = "@context"];

  repeated string also_known_as = 4;
  optional bool biometric_protected = 5;
  optional bool hardware_bound = 6;
  string device_model = 7;
  string user_verification_method = 8; // Optional: none, pin, passcode, password, fingerprint, face, iris, voice, or pattern.

  uint64 sequence = 9;       // MUST equal key_history count + 1 (did:me spec Section 15.1).
  optional string prev = 10; // Present iff sequence > 1; MUST equal the last key_history entry.
  string current_core = 11;  // CIDv1 (dag-cbor, sha2-256, base32) of the core snapshot.
  bytes core_cbor = 12; // Canonical DAG-CBOR bytes; JSON projection uses base64url.
  repeated string key_history = 13; // Prior core CIDs in ascending sequence order; MUST NOT include current_core.

  repeated VerificationMethod verification_method = 14;
  repeated string authentication = 15;
  repeated string assertion_method = 16;
  repeated string capability_invocation = 17;
  repeated string key_agreement = 18;

  repeated Service service = 19;
  UpdatePolicy update_policy = 20;
  repeated Attestation attestations = 21;
  DataIntegrityProof proof = 22;
  repeated DomainVerification domain_verification = 23;
  optional bytes nonce = 24; // Present only for sequence=1; JSON projection uses base64url.
  string eudi_level_of_assurance = 25; // Optional EUDI trust-framework metadata.
  string eudi_schema_version = 26;     // Optional EUDI trust-framework metadata.
}
